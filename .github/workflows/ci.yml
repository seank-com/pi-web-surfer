name: component
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.6
      - name: Qualify local converter
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/web-surfer-python"
          "$RUNNER_TEMP/web-surfer-python/bin/python" -m pip install --require-hashes -r python/requirements.lock
          "$RUNNER_TEMP/web-surfer-python/bin/python" -m pip check
          echo "WEB_SURFER_PYTHON=$RUNNER_TEMP/web-surfer-python/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm run test:package
